<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Account</title>
    <link rel="stylesheet" href="signup.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
</head>
</head>
<body>
    <div class="background"></div>
    
    <div class="container">
        <div class="signup-card">
            <h1 class="title">Create Your Account</h1>
            
            <form class="signup-form">
                <div class="input-group">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <input type="text" placeholder="Full Name" class="input-field" required>
                </div>
                
                <div class="input-group">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                        <path d="M3 7l9 6 9-6"></path>
                    </svg>
                    <input type="email" placeholder="Email Address" class="input-field" required>
                </div>
                
                <div class="input-group">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="5" y="11" width="14" height="10" rx="2"></rect>
                        <path d="M12 17a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"></path>
                        <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
                    </svg>
                    <input type="password" placeholder="Password" class="input-field" required>
                </div>
                
                <div class="input-group">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="5" y="11" width="14" height="10" rx="2"></rect>
                        <path d="M12 17a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"></path>
                        <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
                    </svg>
                    <input type="password" placeholder="Confirm Password" class="input-field" required>
                </div>
                
                <button type="submit" class="signup-button">Sign Up</button>
                
                <p class="login-link">
                    Already have an account? <a href="login.html" class="link">Log In</a>
                </p>
            </form>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    
    <script src="signup.js"></script>
</body>
</html>
