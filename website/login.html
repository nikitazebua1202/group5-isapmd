<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloomify Boutique - Login</title>
    <link rel="stylesheet" href="login.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
</head>
<body>
    <div class="background"></div>
    
    <div class="container">
        <div class="login-card">
            <h1 class="title">Bloomify Boutique</h1>
            <h2 class="subtitle">LOG IN TO YOUR ACCOUNT</h2>
            
            <form class="login-form">
                <div class="input-group">
                    <span class="icon">✿</span>
                    <input type="email" placeholder="EMAIL" class="input-field" required>
                </div>
                
                <div class="input-group">
                    <span class="icon">✿</span>
                    <input type="password" placeholder="PASSWORD" class="input-field" required>
                </div>
                
                <button type="submit" class="login-button">LOGIN</button>
                
                <div class="links">
                    <a href="resetpass.html" class="link">Forgot Password?</a>
                    <a href="signup.html" class="link">Create Account</a>
                </div>
            </form>
        </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="login.js"></script>
</body>
</html>
