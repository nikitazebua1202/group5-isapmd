<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Your Password - The Flower Boutique</title>
    <link rel="stylesheet" href="resetpass.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
</head>
</head>
<body>
    <div class="background"></div>
    
    <div class="container">
        <div class="reset-card">
            <h1 class="title">Bloomify Boutique</h1>
            <h2 class="subtitle">RESET YOUR PASSWORD</h2>
            
            <p class="description">
                Please enter your email address and new password below
            </p>
            
            <form class="reset-form">
                <div class="input-group">
                    <input type="email" placeholder="EMAIL ADDRESS" class="input-field" required>
                </div>
                
                <div class="input-group">
                    <input type="password" placeholder="NEW PASSWORD" class="input-field" required>
                </div>
                
                <div class="input-group">
                    <input type="password" placeholder="CONFIRM NEW PASSWORD" class="input-field" required>
                </div>
                
                <button type="submit" class="submit-button">RESET PASSWORD</button>
            </form>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="resetpass.js"></script>
</body>
</html>
